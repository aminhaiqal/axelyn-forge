name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the backend packages
        run: python -m pip install -e "./packages/forge-core[dev]" -e "./apps/api[dev]" -e "./apps/converter[dev]"

      - name: Run backend tests
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build the web app
        env:
          PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Zm9vLmNsZXJrLmFjY291bnRzLmRldiQ=
          CLERK_SECRET_KEY: sk_test_ci_placeholder
        run: npm run build:web

  edge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Validate private storage Worker
        run: npx wrangler deploy --dry-run --config infra/cloudflare/storage.wrangler.jsonc

  containers:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: infra/docker/api.Dockerfile
          - name: core
            dockerfile: infra/docker/core.Dockerfile
          - name: converter
            dockerfile: infra/docker/converter.Dockerfile
          - name: web
            dockerfile: infra/docker/web.Dockerfile
          - name: frontend
            dockerfile: infra/docker/frontend.Dockerfile
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build ${{ matrix.name }} image
        run: docker build --file "${{ matrix.dockerfile }}" --tag "axelyn-forge-${{ matrix.name }}:ci" .

  publish:
    if: github.event_name == 'push'
    needs: [backend, frontend, edge, containers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: infra/docker/api.Dockerfile
          - name: core
            dockerfile: infra/docker/core.Dockerfile
          - name: converter
            dockerfile: infra/docker/converter.Dockerfile
          - name: web
            dockerfile: infra/docker/web.Dockerfile
          - name: frontend
            dockerfile: infra/docker/frontend.Dockerfile
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
