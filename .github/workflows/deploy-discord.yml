name: Deploy Discord bot

on:
  push:
    branches:
      - agent/resume-tailoring-pipeline

permissions:
  contents: read

concurrency:
  group: axelyn-forge-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Forge
        run: python -m pip install .

      - name: Run the regression suite
        run: python -m unittest -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure restricted deployment SSH key
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          install -d -m 700 "$RUNNER_TEMP/forge-ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/forge-ssh/deploy-key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/forge-ssh/known-hosts"
          chmod 600 "$RUNNER_TEMP/forge-ssh/deploy-key" "$RUNNER_TEMP/forge-ssh/known-hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/forge-ssh/deploy-key" > /dev/null

      - name: Deploy and verify the Discord bot
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          timeout 15m ssh \
            -i "$RUNNER_TEMP/forge-ssh/deploy-key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/forge-ssh/known-hosts" \
            "$VPS_USER@$VPS_HOST" \
            "deploy $GITHUB_SHA"
