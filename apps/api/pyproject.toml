[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "axelyn-forge-api"
version = "0.1.0"
description = "Public HTTP API for the Axelyn Forge service"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "email-validator>=2,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]

[project.scripts]
forge-api = "axelyn_api.main:run"

[tool.setuptools.packages.find]
where = ["src"]
include = ["axelyn_api*"]
