[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "axelyn-forge-api"
version = "0.3.0"
description = "Public HTTP API for the Axelyn Forge service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "axelyn-forge-core==0.3.0",
  "clerk-backend-api>=6,<7",
  "email-validator>=2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "lxml>=4.9,<7",
  "pypdf>=6,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
forge-api = "axelyn_api.main:run"

[tool.setuptools.packages.find]
where = ["src"]
include = ["axelyn_api*"]
