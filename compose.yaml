name: axelyn-forge

services:
  forge-discord:
    build:
      context: .
    image: axelyn-forge-discord:local
    restart: unless-stopped
    env_file:
      - ${FORGE_ENV_FILE:-.env}
    environment:
      FORGE_DATABASE: /state/context.sqlite3
      FORGE_OUTPUT_DIR: /state/output
    volumes:
      - forge-state:/state
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 30s

volumes:
  forge-state:
