name: axelyn-forge

x-runtime-security: &runtime-security
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  converter:
    <<: *runtime-security
    image: ${FORGE_CONVERTER_IMAGE:-ghcr.io/aminhaiqal/axelyn-forge-converter:latest}
    environment:
      FORGE_CONVERTER_CONCURRENCY: ${FORGE_CONVERTER_CONCURRENCY:-1}
      FORGE_CONVERTER_MAX_DOCX_BYTES: ${FORGE_CONVERTER_MAX_DOCX_BYTES:-12582912}
      FORGE_CONVERTER_MAX_IMAGE_BYTES: ${FORGE_CONVERTER_MAX_IMAGE_BYTES:-10485760}
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 128
    tmpfs:
      - /tmp:size=384m,mode=1777
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    <<: *runtime-security
    image: ${FORGE_API_IMAGE:-ghcr.io/aminhaiqal/axelyn-forge-api:latest}
    environment:
      FORGE_ENVIRONMENT: production
      FORGE_DATABASE: /state/context.sqlite3
      FORGE_STORAGE_PATH: /state/objects
      FORGE_STORAGE_ENDPOINT: ${FORGE_STORAGE_ENDPOINT:?Set FORGE_STORAGE_ENDPOINT}
      FORGE_STORAGE_TOKEN: ${FORGE_STORAGE_TOKEN:?Set FORGE_STORAGE_TOKEN}
      FORGE_RESUME_TEMPLATE: /app/templates/Axelyn_Standard_Resume_v1.docx
      FORGE_CONVERTER_ENDPOINT: http://converter:8100
      FORGE_CONVERTER_TIMEOUT_SECONDS: ${FORGE_CONVERTER_TIMEOUT_SECONDS:-150}
      FORGE_CORS_ORIGINS: https://forge.axelyn.com
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      CLERK_AUTHORIZED_PARTIES: https://forge.axelyn.com
    volumes:
      - forge-state:/state
    depends_on:
      converter:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 128
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    <<: *runtime-security
    image: ${FORGE_FRONTEND_IMAGE:-ghcr.io/aminhaiqal/axelyn-forge-frontend:latest}
    environment:
      PUBLIC_CLERK_PUBLISHABLE_KEY: ${PUBLIC_CLERK_PUBLISHABLE_KEY:?Set PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY}
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    <<: *runtime-security
    image: ${FORGE_WEB_IMAGE:-ghcr.io/aminhaiqal/axelyn-forge-web:latest}
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755,uid=101,gid=101
      - /var/run:size=1m,mode=0755,uid=101,gid=101
      - /tmp:size=8m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  tunnel:
    <<: *runtime-security
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.9.1}
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/cloudflare-tunnel-token
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${CLOUDFLARE_TUNNEL_TOKEN_FILE:-./secrets/cloudflare-tunnel-token}
        target: /run/secrets/cloudflare-tunnel-token
        read_only: true
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 100
    tmpfs:
      - /tmp:size=32m,mode=1777

volumes:
  forge-state:
