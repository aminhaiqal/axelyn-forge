name: axelyn-forge

services:
  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    image: axelyn-forge-api:local
    restart: unless-stopped
    env_file:
      - path: ${FORGE_ENV_FILE:-../.env}
        required: false
    environment:
      FORGE_ENVIRONMENT: production
      FORGE_DATABASE: /state/context.sqlite3
      FORGE_CORS_ORIGINS: ${FORGE_CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - forge-state:/state
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        PUBLIC_API_BASE_URL: ""
    image: axelyn-forge-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FORGE_WEB_PORT:-8080}:8080"
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755,uid=101,gid=101
      - /var/run:size=1m,mode=0755,uid=101,gid=101
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  forge-state:
