name: axelyn-forge

services:
  converter:
    build:
      context: ..
      dockerfile: infra/docker/converter.Dockerfile
    image: axelyn-forge-converter:local
    restart: unless-stopped
    environment:
      FORGE_CONVERTER_CONCURRENCY: ${FORGE_CONVERTER_CONCURRENCY:-1}
      FORGE_CONVERTER_MAX_DOCX_BYTES: ${FORGE_CONVERTER_MAX_DOCX_BYTES:-12582912}
      FORGE_CONVERTER_MAX_IMAGE_BYTES: ${FORGE_CONVERTER_MAX_IMAGE_BYTES:-10485760}
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=384m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    image: axelyn-forge-api:local
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
      - path: ../.env.local
        required: false
    environment:
      FORGE_ENVIRONMENT: production
      FORGE_DATABASE: /state/context.sqlite3
      FORGE_STORAGE_PATH: /state/objects
      FORGE_STORAGE_ENDPOINT: ${FORGE_STORAGE_ENDPOINT:-}
      FORGE_STORAGE_TOKEN: ${FORGE_STORAGE_TOKEN:-}
      FORGE_CONVERTER_ENDPOINT: http://converter:8100
      FORGE_CONVERTER_TIMEOUT_SECONDS: ${FORGE_CONVERTER_TIMEOUT_SECONDS:-150}
      FORGE_CORS_ORIGINS: ${FORGE_CORS_ORIGINS:-http://localhost:8080}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-http://localhost:8080,http://127.0.0.1:8080}
    volumes:
      - forge-state:/state
    depends_on:
      converter:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        PUBLIC_API_BASE_URL: ""
        PUBLIC_CLERK_PUBLISHABLE_KEY: ${PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_Zm9vLmNsZXJrLmFjY291bnRzLmRldiQ=}
    image: axelyn-forge-frontend:local
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
      - path: ../.env.local
        required: false
      - path: ../apps/web/.env
        required: false
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    image: axelyn-forge-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${FORGE_WEB_PORT:-8080}:8080"
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755,uid=101,gid=101
      - /var/run:size=1m,mode=0755,uid=101,gid=101
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  forge-state:
