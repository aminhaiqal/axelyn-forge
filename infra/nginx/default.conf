map $http_cf_connecting_ip $request_client_key {
    default $http_cf_connecting_ip;
    "" $binary_remote_addr;
}

map $http_x_forwarded_proto $request_scheme {
    default $scheme;
    https https;
}

limit_req_zone $request_client_key zone=service_intake:10m rate=10r/m;
limit_req_zone $request_client_key zone=forge_briefs:10m rate=6r/m;
limit_req_zone $request_client_key zone=resume_writes:10m rate=15r/m;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 55m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://clerk-telemetry.com https://*.clerk-telemetry.com https://*.clerk.accounts.dev https://clerk.forge.axelyn.com https://accounts.forge.axelyn.com https://*.protect.clerk.com:*; font-src 'self'; img-src 'self' data: https://img.clerk.com; script-src 'self' 'unsafe-inline' https://*.clerk.accounts.dev https://clerk.forge.axelyn.com https://challenges.cloudflare.com https://*.protect.clerk.com; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; frame-src 'self' https://challenges.cloudflare.com https://*.protect.clerk.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/v1/service-requests {
        limit_req zone=service_intake burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $request_scheme;
    }

    location = /api/v1/forge-briefs {
        limit_req zone=forge_briefs burst=3 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $request_scheme;
    }

    location = /api/v1/resumes/imports {
        limit_req zone=resume_writes burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $request_scheme;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $request_scheme;
    }

    location / {
        proxy_pass http://frontend:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $request_scheme;
    }

    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 7d;
        proxy_pass http://frontend:4321;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $request_scheme;
    }
}
