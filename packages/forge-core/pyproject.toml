[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "axelyn-forge-core"
version = "0.3.0"
description = "Shared document and provider primitives for Axelyn Forge"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "jsonschema[format]>=4.18,<5",
  "lxml>=4.9,<7",
  "openai>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["forge*"]
