[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "axelyn-forge"
version = "0.1.0"
description = "Deterministic canonical-resume to SDT-enabled DOCX renderer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "jsonschema[format]>=4.18,<5",
  "lxml>=4.9,<7",
  "openai>=2,<3",
]

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools.packages.find]
include = ["forge*"]
